# zipline's claims. The bar for an entry is NOT "this seems important". It is "this broke
# silently once, and we found out later", or "this is the safeguard that catches that".
# Every `why` below is a real incident. Every proof has been seen to fail before it was trusted.
#
#   python3 tools/claimcheck.py            exit code = number of failed claims

[gates: the GIMP install stops, showing where it downloads from and that it uses sudo]
why    = Asked to install GIMP, the assistant ran `sudo -n snap install gimp` from the Snap
         Store on a machine whose settings allowed only the Ubuntu archive and GitHub. The
         request agreed to the goal; nobody agreed to the source, sudo or background updates.
         (Checks the phrase, not just "isn't on your allowed list": with the install check
         deleted, the network rule alone would still print that, as "connect api.snapcraft.io".)
prove  = python3 tools/check_hooks.py gate-gimp
expect = type exactly: install gimp
tag    = gates

[gates: a signature lets that exact action run once, then it stops again]
why    = A signature that stays valid becomes a standing yes nobody remembers giving. Single
         use is what makes the journal's "signed" line mean one thing happened.
prove  = python3 tools/check_hooks.py gate-signed-once
expect = RESULT stopped signed allowed stopped
tag    = gates

[gates: a signature survives the assistant rewording its own description]
why    = Claude Code's Bash event carries a description the assistant rewrites on every call,
         and the fingerprint included it. Signed, then re-run with "Install the GIMP image
         editor" instead of "Install GIMP": stopped again. Sign, stopped, sign again: a loop
         generator in the repo built to stop loops. Found by review, not by these claims: the
         fixture sent one-key events, so what varies in production never varied in the test.
prove  = python3 tools/check_hooks.py gate-reworded
expect = RESULT stopped signed allowed
tag    = gates

[gates: a near-miss signature is called out, not silently ignored]
why    = "install gimp please" was met with silence: the person believed they'd signed, the
         assistant was told nothing, and nobody said otherwise.
prove  = python3 tools/check_hooks.py gate-near-miss
expect = RESULT stopped near-miss stopped
tag    = gates

[gates: a subagent's report can't sign, even when it is the phrase]
why    = Testing whether the gate works inside a subagent (it does), the subagent's finished-
         task report reached the signature check as if the person had typed it, and was read
         as a near-miss of "connect example.org". The report is written by the assistant's
         side. If it could sign, the assistant could sign its own request.
prove  = python3 tools/check_hooks.py gate-notification
expect = RESULT stopped ignored ignored stopped
tag    = gates

[gates: the shell and the editor follow the same rule for writing files]
why    = The editor needed a signature to change a file outside this folder, but `cp`,
         `sed -i`, `tee`, a redirect or `git apply` after a `cd` did the same change unsigned.
         Noticed while about to update another project's TRAPS.md: one `git apply` would
         have done it without asking.
prove  = python3 tools/check_hooks.py gate-shell-write
expect = RESULT stopped stopped allowed
tag    = gates

[gates: a script's text isn't read as shell, but a shell's here-document is]
why    = A Python test script containing the string ">> ~/f" was stopped as if it wrote to the
         home folder (the text-scan trap). The fix must not open the other door: a body fed to
         bash really is commands.
prove  = python3 tools/check_hooks.py gate-heredoc
expect = RESULT allowed stopped
tag    = gates

[gates: "yes" answers the latest request, not one the assistant dropped]
why    = "yes, close the gap", answering a question, was told "that isn't a signature, waiting
         for: install gimp", a request abandoned 28 minutes earlier. A stale request hijacking
         the next yes teaches people the gate is noise.
prove  = python3 tools/check_hooks.py gate-stale-yes
expect = RESULT stopped ignored ignored
tag    = gates

[gates: "yes" is not a signature]
why    = A reflexive "yes, go ahead" is how people approve things they didn't read. The
         signature names the action, so typing it means reading it.
prove  = python3 tools/check_hooks.py gate-yes
expect = RESULT stopped not-a-signature stopped
tag    = gates

[gates: a changed command after signing needs a new signature]
why    = The specifics are what's signed. Signing the apt install must not cover a switch to
         the Snap Store, which is what the unsigned GIMP install did in the first place.
prove  = python3 tools/check_hooks.py gate-changed
expect = RESULT stopped signed stopped
tag    = gates

[gates: a signature typed after the request expired doesn't count, and the person is told]
why    = Without the telling part, a late signature does nothing and nobody says so: the
         person thinks they approved it.
prove  = python3 tools/check_hooks.py gate-expired
expect = RESULT stopped expired stopped
tag    = gates

[gates: the journal can be read, never changed]
why    = The first version refused any command that mentioned the journal, so the owner
         couldn't ask what was in it. Changing it must stay impossible: a record the
         assistant can edit is a record of what it says happened.
prove  = python3 tools/check_hooks.py gate-read
expect = RESULT allowed refused
tag    = gates

[gates: writing the journal directly is refused, signed or not]
why    = The safeguards record what happened. If a signature could unlock the record, the
         assistant could ask for one.
prove  = python3 tools/check_hooks.py gate-sealed
expect = no signature can allow it
tag    = gates

[gates: ordinary work isn't gated]
why    = A gate on every draft and preview trains people to sign without reading, which is
         the reflex the gate exists to break.
prove  = python3 tools/check_hooks.py gate-free
expect = RESULT allowed allowed
tag    = gates

[gates: if the gate itself fails, the action doesn't run]
why    = A safeguard that fails open is a door that unlocks when the lock breaks.
prove  = python3 tools/check_hooks.py gate-fail-closed
expect = couldn't run, so this action is stopped
tag    = gates

[safeguards: a session starts with the owner's settings in front of the assistant]
why    = First real session with a workalong.md (network strict, two allowed addresses):
         asked to install GIMP, the assistant never opened workalong.md and installed from the
         Snap Store with sudo. CLAUDE.md said "read it first"; nothing made it. The session
         log showed three tool calls, none of them touching the file.
prove  = python3 tools/check_hooks.py session-strict
expect = network is STRICT
tag    = safeguards

[safeguards: the attempt limit is announced on the last attempt, not after it]
why    = The whole point is to stop the twentieth version of an email. A limit announced one
         version late is a limit the assistant has already gone past by the time it hears it.
prove  = python3 tools/check_hooks.py at-limit
expect = that was attempt 2 of 2 on drafts/menu, the limit
tag    = safeguards

[safeguards: going past the limit is called out, and journalled]
why    = If "keep going" is the person's call, it has to be a call they know they're making.
prove  = python3 tools/check_hooks.py over-limit
expect = over-limit  drafts/menu/menu-v3.html
tag    = safeguards

[safeguards: a second "still wrong" turns into a reset, not another attempt]
why    = The fleet incident: 45 minutes of patching around each failure before anyone stepped
         back. The person was saying it was wrong; nothing listened.
prove  = python3 tools/check_hooks.py repeat
expect = the person may be going round in circles
tag    = safeguards

[safeguards: files outside drafts/ don't count as attempts]
why    = A counter that fires on every file trains people and the assistant to ignore it.
         It must be quiet because it checked, not because it crashed: a crash is also silent to
         the assistant, and the first version of this claim passed with the check deleted.
prove  = python3 tools/check_hooks.py outside-drafts
expect = (silent)
absent = failed
tag    = safeguards

[safeguards: a broken event never stops the session, and is journalled]
why    = A logging call that raised broke every k3s join for a day in AgentDrax. A safeguard
         that crashes takes down the work it was guarding.
prove  = python3 tools/check_hooks.py broken-event
expect = problem     zipline safeguard 'prompt' failed
tag    = safeguards

[look: a draft that points at a missing file is not OK]
why    = An email was described to the owner as "with the logo at the top" while it pointed
         at logo.png, and only logo.svg existed. Recipients would have seen alt text.
prove  = d=$(mktemp -d) && printf '<img src="missing.png">' > $d/e.html && python3 tools/look.py $d/e.html; rm -rf $d
expect = refers to 'missing.png', which doesn't exist
tag    = look

[settings: the ask-first list can't be weakened from workalong.md]
why    = Sending, prices, deleting, spending and installing need the person at every level. A
         settings file that could switch one off would make every other safeguard optional.
prove  = d=$(mktemp -d) && printf -- "---\nalso-ask: don't ask before sending\n---\n" > $d/w.md && python3 tools/settings.py $d/w.md; rm -rf $d
expect = always-ask send, promise, delete, spend, install
tag    = settings

[form: a newline in an answer can't add a setting]
why    = The setup page writes settings lines from what people type. "Evil Co" followed by a
         newline and "attempts: 9" must stay part of the business name.
prove  = node -e 'process.stdout.write(require("./docs/form.js").build({business:"Evil Co\nattempts: 9"}))' > /tmp/zipline-claim-form.md && python3 tools/settings.py /tmp/zipline-claim-form.md
expect = attempts   3
needs  = node
tag    = form

[repo: the format description is in git]
why    = .gitignore's line for the owner's own workalong.md matched docs/workalong.md too, and
         the format description was silently left out of a commit. Nothing complained.
prove  = git ls-files docs/workalong.md
expect = docs/workalong.md
tag    = repo

[repo: the business's own files stay out of git]
why    = Customer names, prices and logos live in these folders. Publishing a fork must never
         publish the business.
prove  = git check-ignore workalong.md lessons.md journal/x brand/x drafts/x ready/x previews/x .zipline/x | wc -l
expect = 8
tag    = repo
