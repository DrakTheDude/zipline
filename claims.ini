# zipline's claims. The bar for an entry is NOT "this seems important". It is "this broke
# silently once, and we found out later", or "this is the safeguard that catches that".
# Every `why` below is a real incident. Every proof has been seen to fail before it was trusted.
#
#   python3 tools/claimcheck.py            exit code = number of failed claims

[gates: the GIMP install stops, showing where it downloads from and that it uses sudo]
why    = Asked to install GIMP, the assistant ran `sudo -n snap install gimp` from the Snap
         Store on a machine whose settings allowed only the Ubuntu archive and GitHub. The
         request agreed to the goal; nobody agreed to the source, sudo or background updates.
         (Checks the phrase, not just "isn't on your allowed list": with the install check
         deleted, the network rule alone would still print that, as "connect api.snapcraft.io".)
prove  = python3 tools/check_hooks.py gate-gimp
expect = type exactly: install gimp
tag    = gates

[gates: a signature lets that exact action run once, then it stops again]
why    = A signature that stays valid becomes a standing yes nobody remembers giving. Single
         use is what makes the journal's "signed" line mean one thing happened.
prove  = python3 tools/check_hooks.py gate-signed-once
expect = RESULT stopped signed allowed stopped
tag    = gates

[gates: a signature survives the assistant rewording its own description]
why    = Claude Code's Bash event carries a description the assistant rewrites on every call,
         and the fingerprint included it. Signed, then re-run with "Install the GIMP image
         editor" instead of "Install GIMP": stopped again. Sign, stopped, sign again: a loop
         generator in the repo built to stop loops. Found by review, not by these claims: the
         fixture sent one-key events, so what varies in production never varied in the test.
prove  = python3 tools/check_hooks.py gate-reworded
expect = RESULT stopped signed allowed
tag    = gates

[gates: a near-miss signature is called out, not silently ignored]
why    = "install gimp please" was met with silence: the person believed they'd signed, the
         assistant was told nothing, and nobody said otherwise.
prove  = python3 tools/check_hooks.py gate-near-miss
expect = RESULT stopped near-miss stopped
tag    = gates

[gates: a subagent's report can't sign, even when it is the phrase]
why    = Testing whether the gate works inside a subagent (it does), the subagent's finished-
         task report reached the signature check as if the person had typed it, and was read
         as a near-miss of "connect example.org". The report is written by the assistant's
         side. If it could sign, the assistant could sign its own request.
prove  = python3 tools/check_hooks.py gate-notification
expect = RESULT stopped ignored ignored stopped
tag    = gates

[gates: the shell and the editor follow the same rule for writing files]
why    = The editor needed a signature to change a file outside this folder, but `cp`,
         `sed -i`, `tee`, a redirect or `git apply` after a `cd` did the same change unsigned.
         Noticed while about to update another project's TRAPS.md: one `git apply` would
         have done it without asking.
prove  = python3 tools/check_hooks.py gate-shell-write
expect = RESULT stopped stopped allowed
tag    = gates

[gates: a script's text isn't read as shell, but a shell's here-document is]
why    = A Python test script containing the string ">> ~/f" was stopped as if it wrote to the
         home folder (the text-scan trap). The fix must not open the other door: a body fed to
         bash really is commands.
prove  = python3 tools/check_hooks.py gate-heredoc
expect = RESULT allowed stopped
tag    = gates

[gates: "yes" answers the latest request, not one the assistant dropped]
why    = "yes, close the gap", answering a question, was told "that isn't a signature, waiting
         for: install gimp", a request abandoned 28 minutes earlier. A stale request hijacking
         the next yes teaches people the gate is noise.
prove  = python3 tools/check_hooks.py gate-stale-yes
expect = RESULT stopped ignored ignored
tag    = gates

[git: with a team, nothing is committed on main]
why    = A team's complaint that started the git rules: the assistant's work lands where nobody
         reviewed it. With a reviewer in the loop, main is reached by a pull request. Refused
         outright, not signable: a signature here becomes a habit, and a branch costs nothing.
prove  = python3 tools/check_hooks.py git-branch
expect = RESULT refused allowed
tag    = git

[git: the session starts knowing who reviews the work]
why    = Adding zipline to an existing repository with team: pair, a real session was asked
         what happens if it commits straight to main: "nothing I've seen says the safeguards
         would block it", and it named the reviewer as "you, just-me". The gate would have
         refused; the session-start message never mentioned team.
prove  = python3 tools/check_hooks.py session-team
expect = team is PAIR: nothing is committed or pushed to main here
tag    = git

[git: a commit too big to review stops]
why    = The same team: the assistant puts forty files in a commit, so review is either a
         rubber stamp or a week. The limit is commit-files in workalong.md, default 15.
prove  = python3 tools/check_hooks.py git-size
expect = RESULT stopped allowed
tag    = git

[git: with a team, main isn't pushed to; branches are, signed]
why    = Branch rules on GitHub enforce the reviews, but only if the work goes through a pull
         request. A direct push to main skips the review the team set up.
prove  = python3 tools/check_hooks.py git-push-main
expect = RESULT refused stopped stopped
tag    = git

[git: a push stops while claims fail, naming them]
why    = Only validated work is pushed. "Should work" pushed is a teammate's afternoon.
prove  = python3 tools/check_hooks.py git-push-claims
expect = RESULT refused stopped
tag    = git

[git: changing GitHub through gh needs a signature; reading doesn't]
why    = Designing the git rules, the command to set review requirements was `gh api -X PUT`,
         and the gate didn't know gh at all: merges, repo settings and branch rules would have
         run unasked.
prove  = python3 tools/check_hooks.py gh-write
expect = RESULT stopped stopped allowed allowed
tag    = git

[gates: a phrase typed with no request waiting is called out]
why    = The assistant asked for "push origin" before trying the push, so the gate had raised no
         request. The person typed it, nothing happened, and nothing said so: the same silence
         as a near miss. The push stopped again and they had to sign twice.
prove  = python3 tools/check_hooks.py gate-unasked
expect = RESULT unasked stopped signed quiet
tag    = gates

[gates: changing the safeguards' own files needs a signature]
why    = Nothing stopped the assistant writing .claude/settings.local.json, where one line
         switches every hook off, or editing the gate's own code or the rules it follows. Noticed
         while wiring up plugins in that file. Left open on purpose while zipline was being
         built, and closed on the way out.
prove  = python3 tools/check_hooks.py gate-safeguards
expect = RESULT stopped stopped stopped allowed
tag    = gates

[git: a GitHub change says what it changes]
why    = Making this repository public stopped for a signature with "changes GitHub: gh repo
         edit DrakTheDude/zipline": the options were dropped, and the one that mattered was
         --visibility public. The assistant had to explain it; the safeguard should.
prove  = python3 tools/check_hooks.py gh-visibility
expect = makes the repository public: anyone can see it, and copy it
tag    = git

[gates: "yes" is not a signature]
why    = A reflexive "yes, go ahead" is how people approve things they didn't read. The
         signature names the action, so typing it means reading it.
prove  = python3 tools/check_hooks.py gate-yes
expect = RESULT stopped not-a-signature stopped
tag    = gates

[gates: a changed command after signing needs a new signature]
why    = The specifics are what's signed. Signing the apt install must not cover a switch to
         the Snap Store, which is what the unsigned GIMP install did in the first place.
prove  = python3 tools/check_hooks.py gate-changed
expect = RESULT stopped signed stopped
tag    = gates

[gates: a signature typed after the request expired doesn't count, and the person is told]
why    = Without the telling part, a late signature does nothing and nobody says so: the
         person thinks they approved it.
prove  = python3 tools/check_hooks.py gate-expired
expect = RESULT stopped expired stopped
tag    = gates

[gates: the journal can be read, never changed]
why    = The first version refused any command that mentioned the journal, so the owner
         couldn't ask what was in it. Changing it must stay impossible: a record the
         assistant can edit is a record of what it says happened.
prove  = python3 tools/check_hooks.py gate-read
expect = RESULT allowed refused
tag    = gates

[gates: writing the journal directly is refused, signed or not]
why    = The safeguards record what happened. If a signature could unlock the record, the
         assistant could ask for one.
prove  = python3 tools/check_hooks.py gate-sealed
expect = no signature can allow it
tag    = gates

[gates: ordinary work isn't gated]
why    = A gate on every draft and preview trains people to sign without reading, which is
         the reflex the gate exists to break.
prove  = python3 tools/check_hooks.py gate-free
expect = RESULT allowed allowed
tag    = gates

[gates: if the gate itself fails, the action doesn't run]
why    = A safeguard that fails open is a door that unlocks when the lock breaks.
prove  = python3 tools/check_hooks.py gate-fail-closed
expect = couldn't run, so this action is stopped
tag    = gates

[safeguards: a session starts with the owner's settings in front of the assistant]
why    = First real session with a workalong.md (network strict, two allowed addresses):
         asked to install GIMP, the assistant never opened workalong.md and installed from the
         Snap Store with sudo. CLAUDE.md said "read it first"; nothing made it. The session
         log showed three tool calls, none of them touching the file.
prove  = python3 tools/check_hooks.py session-strict
expect = network is STRICT
tag    = safeguards

[safeguards: the session gets the working rules for this kind of work]
why    = Splitting the rules by kind of work, the fleet example (an IT person, scripts for
         machines) started its session with the bakery's rules about logos and brand/, because
         it named no profile. Rules for the wrong kind of work are noise the assistant learns
         to skip.
prove  = python3 tools/check_hooks.py session-strict
expect = ## You prepare, the person runs it
tag    = safeguards

[settings: a misspelled profile is reported, not a crash]
why    = The first run of the profile loader crashed the session-start safeguard on a missing
         profile file, so the session started with no settings at all. A typo in workalong.md
         must cost a warning, not every safeguard.
prove  = d=$(mktemp -d) && printf -- "---\nprofile: bakery\n---\n" > $d/w.md && python3 tools/settings.py $d/w.md; rm -rf $d
expect = profile must be one of business, code, infrastructure, got 'bakery'; using business
tag    = settings

[safeguards: one expiry is journalled once, however many times the assistant retries]
why    = Found by an independent review: an aged request was marked expired and journalled on
         every load, but a retried request already pending denies without saving, so one
         dropped "push origin" was written three times across three retries of something else.
         The count was set by the assistant's retries, in the one record it doesn't write.
prove  = python3 tools/check_hooks.py expired-once
expect = expired lines: 1
tag    = safeguards

[setup: says what's wrong with workalong.md, not just what it read]
why    = Found by an independent review: setup.py read the settings and dropped the problems.
         With "team: two developers", the command the install steps tell a stranger to run said
         nothing, the fallback was solo, and commits and pushes to main weren't stopped, while
         the README promised a reviewer's work is refused on main.
prove  = d=$(mktemp -d) && cp -r tools profiles $d/ && printf -- "---\nzipline: 1\nprofile: code\nteam: two developers\n---\n" > $d/workalong.md && python3 $d/tools/setup.py; rm -rf $d
expect = PROBLEM in workalong.md: team must be one of pair, solo, team, got 'two developers'; using solo, the least protective
tag    = setup

[safeguards: they run on Windows, where python3 only opens the Microsoft Store]
why    = The first Windows session: every hook called python3, which there is a shortcut that
         prints "Python was not found" and fails. Claude Code shows a failed hook and carries
         on, so the whole session ran with no signatures, no attempt count and no repeat
         check. The hooks now use the first of python3, python, py that really runs. Proved
         with a stand-in for the Store shortcut ahead of a working python on the path.
prove  = d=$(mktemp -d) && cp -r tools profiles .claude $d/ && mkdir $d/bin && printf '#!/bin/sh\necho "Python was not found" >&2\nexit 9009\n' > $d/bin/python3 && chmod +x $d/bin/python3 && ln -s "$(command -v python3)" $d/bin/python && cmd=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['hooks']['SessionStart'][0]['hooks'][0]['command'])" $d/.claude/settings.json) && echo '{}' | PATH=$d/bin:/usr/bin:/bin CLAUDE_PROJECT_DIR=$d bash -c "$cmd"; rm -rf $d
expect = zipline: no workalong.md here
tag    = safeguards

[gates: installing through setup.py stops, whichever Python runs it]
why    = The install stop matched the word python3 only. On Windows the assistant types
         `python tools/setup.py --install` or `py -3 ...`, and both came back "free to run":
         software installed with nobody signing. Found while fixing the Windows hooks.
prove  = for c in python "py -3" python3.12 python3; do python3 tools/gates.py "$c tools/setup.py --install" | head -1; done | grep -c "install setup"
expect = 4
tag    = gates

[safeguards: the attempt limit is announced on the last attempt, not after it]
why    = The whole point is to stop the twentieth version of an email. A limit announced one
         version late is a limit the assistant has already gone past by the time it hears it.
prove  = python3 tools/check_hooks.py at-limit
expect = that was attempt 2 of 2 on drafts/menu, the limit
tag    = safeguards

[safeguards: going past the limit is called out, and journalled]
why    = If "keep going" is the person's call, it has to be a call they know they're making.
prove  = python3 tools/check_hooks.py over-limit
expect = over-limit  drafts/menu/menu-v3.html
tag    = safeguards

[safeguards: a second "still wrong" turns into a reset, not another attempt]
why    = The fleet incident: 45 minutes of patching around each failure before anyone stepped
         back. The person was saying it was wrong; nothing listened.
prove  = python3 tools/check_hooks.py repeat
expect = the person may be going round in circles
tag    = safeguards

[safeguards: two corrections long ago don't make every later one a loop]
why    = The counter never forgot. In a session two days long it had passed two, so every message
         after that with "as I said" in it told the assistant to reset, mid-planning, twice in a
         morning. A nudge that fires on everything is ignored, including when it's right.
prove  = python3 tools/check_hooks.py repeat-forgets
expect = RESULT quiet nudged quiet quiet quiet quiet quiet quiet
tag    = safeguards

[safeguards: someone explaining isn't someone correcting]
why    = Both of that morning's false alarms were long messages working out a new direction:
         "that's the same problem" and "as I said". Replayed against the whole session, every
         match came from a message over 120 words; every real correction seen was a line.
prove  = python3 tools/check_hooks.py repeat-explaining
expect = RESULT quiet quiet
tag    = safeguards

[safeguards: pasted text is someone else's words, not the person repeating themselves]
why    = A pasted draft containing "still not" and a pasted review containing "I said" both
         counted as the person signalling it was wrong.
prove  = python3 tools/check_hooks.py repeat-pasted
expect = RESULT quiet quiet
tag    = safeguards

[safeguards: files outside drafts/ don't count as attempts]
why    = A counter that fires on every file trains people and the assistant to ignore it.
         It must be quiet because it checked, not because it crashed: a crash is also silent to
         the assistant, and the first version of this claim passed with the check deleted.
prove  = python3 tools/check_hooks.py outside-drafts
expect = (silent)
absent = failed
tag    = safeguards

[safeguards: a broken event never stops the session, and is journalled]
why    = A logging call that raised broke every k3s join for a day in AgentDrax. A safeguard
         that crashes takes down the work it was guarding.
prove  = python3 tools/check_hooks.py broken-event
expect = problem     zipline safeguard 'prompt' failed
tag    = safeguards

[look: a draft that points at a missing file is not OK]
why    = An email was described to the owner as "with the logo at the top" while it pointed
         at logo.png, and only logo.svg existed. Recipients would have seen alt text.
prove  = d=$(mktemp -d) && printf '<img src="missing.png">' > $d/e.html && python3 tools/look.py $d/e.html; rm -rf $d
expect = refers to 'missing.png', which doesn't exist
tag    = look

[settings: the ask-first list can't be weakened from workalong.md]
why    = Sending, prices, deleting, spending and installing need the person at every level. A
         settings file that could switch one off would make every other safeguard optional.
prove  = d=$(mktemp -d) && printf -- "---\nalso-ask: don't ask before sending\n---\n" > $d/w.md && python3 tools/settings.py $d/w.md; rm -rf $d
expect = always-ask send, promise, delete, spend, install
tag    = settings

[form: a newline in an answer can't add a setting]
why    = The setup page writes settings lines from what people type. "Evil Co" followed by a
         newline and "attempts: 9" must stay part of the business name.
prove  = node -e 'process.stdout.write(require("./docs/form.js").build({business:"Evil Co\nattempts: 9"}))' > /tmp/zipline-claim-form.md && python3 tools/settings.py /tmp/zipline-claim-form.md
expect = attempts   3
needs  = node
tag    = form

[setup: the profile's plugins are turned on, and the other profiles' off]
why    = The README said the small-business plugin "is turned on when you open this folder".
         Asked in a fresh copy, a real session had none of its skills, and it wasn't installed
         anywhere: the shared settings asked for it and nothing acted on it. Turned on in the
         per-computer settings file, a plugin installed and loaded at the next start.
prove  = d=$(mktemp -d) && cp -r tools profiles $d/ && mkdir $d/.claude && printf -- "---\nzipline: 1\nprofile: code\n---\n" > $d/workalong.md && echo '{"permissions":{"allow":["Bash(ls)"]}}' > $d/.claude/settings.local.json && python3 $d/tools/setup.py > /dev/null; python3 -c "import json,sys; print(json.load(open(sys.argv[1])))" $d/.claude/settings.local.json; rm -rf $d
expect = 'enabledPlugins': {'engineering@knowledge-work-plugins': True, 'operations@knowledge-work-plugins': False, 'small-business@knowledge-work-plugins': False}
tag    = setup

[setup: turning plugins on keeps the person's own local settings]
why    = settings.local.json also holds the person's own permissions. A setup step that
         rewrote it would quietly undo choices they made.
prove  = d=$(mktemp -d) && cp -r tools profiles $d/ && mkdir $d/.claude && printf -- "---\nzipline: 1\nprofile: code\n---\n" > $d/workalong.md && echo '{"permissions":{"allow":["Bash(ls)"]}}' > $d/.claude/settings.local.json && python3 $d/tools/setup.py > /dev/null; python3 -c "import json,sys; print(json.load(open(sys.argv[1])))" $d/.claude/settings.local.json; rm -rf $d
expect = {'permissions': {'allow': ['Bash(ls)']}
tag    = setup

[form: the kind of work and who reviews it reach the settings]
why    = The git rules shipped reading `team` from workalong.md, and the setup page couldn't
         write it: anyone setting up from the page got solo rules, whatever their team.
prove  = node -e 'process.stdout.write(require("./docs/form.js").build({profile:"code",team:"pair"}))' > /tmp/zipline-claim-team.md && python3 tools/settings.py /tmp/zipline-claim-team.md
expect = team       pair
needs  = node
tag    = form

[repo: the format description is in git]
why    = .gitignore's line for the owner's own workalong.md matched docs/workalong.md too, and
         the format description was silently left out of a commit. Nothing complained.
prove  = git ls-files docs/workalong.md
expect = docs/workalong.md
tag    = repo

[repo: the business's own files stay out of git]
why    = Customer names, prices and logos live in these folders. Publishing a fork must never
         publish the business.
prove  = git check-ignore workalong.md lessons.md journal/x brand/x drafts/x ready/x previews/x .zipline/x | wc -l
expect = 8
tag    = repo
